<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Last Cast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <section id="me-panel" class="panel" aria-label="Your angler">
      <div class="card-head">
        <div id="level-badge" class="level-badge" title="Your level">1</div>
        <div class="card-title">
          <div id="me-name"></div>
          <div id="account-line">
            <span id="account-label"></span>
            <button type="button" id="account-action"></button>
          </div>
        </div>
      </div>
      <div class="xp-row" title="Experience to the next level"><span class="xpbar"><span id="xp-fill"></span></span><span id="xp-text"></span></div>
      <div class="stat-row">
        <div class="stat" title="Coins to spend"><span class="stat-icon">🪙</span><b id="me-coins">0</b></div>
        <div class="stat" title="Score"><span class="stat-icon">🏆</span><b id="me-score">0</b></div>
        <div class="stat" title="Fish caught"><span class="stat-icon">🐟</span><b id="me-catches">0</b></div>
      </div>
      <div class="info-list">
        <div id="me-location"></div>
        <div id="bait-line"></div>
        <div id="pet-line"></div>
        <div id="boat-line"></div>
        <div id="event-line"></div>
      </div>
    </section>

    <section id="leaderboard" class="panel" aria-label="Leaderboard">
      <h3 id="leaderboard-title">Anglers</h3>
      <ol id="leaderboard-list"></ol>
    </section>

    <div id="toasts"></div>
    <div id="event-panel" class="panel event-panel" hidden></div>
    <div id="prompt" hidden></div>
    <div id="banner" hidden></div>
    <div id="dialog" class="dialog" role="dialog" aria-label="Duel challenge" hidden></div>
    <div id="catch-popup" class="catch-popup" hidden></div>
    <div id="feed" aria-live="polite"></div>
    <div id="status"></div>

    <nav id="dock" aria-label="Menus">
      <button type="button" data-tab="gear" title="Tackle (G)"><span class="dock-icon">🎣</span><span class="dock-label">Tackle</span></button>
      <button type="button" data-tab="armour" title="Armour (R)"><span class="dock-icon">🛡️</span><span class="dock-label">Armour</span></button>
      <button type="button" data-tab="pets" title="Pets (P)"><span class="dock-icon">🐾</span><span class="dock-label">Pets</span></button>
      <button type="button" data-tab="index" title="Fish Index (I)"><span class="dock-icon">📖</span><span class="dock-label">Index</span></button>
      <button type="button" data-tab="achievements" title="Achievements (T)"><span class="dock-icon">🏅</span><span class="dock-label">Goals</span></button>
      <button type="button" data-tab="trophies" title="Trophies and records (K)"><span class="dock-icon">🏆</span><span class="dock-label">Trophies</span></button>
      <button type="button" data-tab="history" title="Catch history (H)"><span class="dock-icon">📜</span><span class="dock-label">History</span></button>
      <button type="button" id="map-toggle" title="Angler's Map (B)"><span class="dock-icon">🗺️</span><span class="dock-label">Map</span></button>
      <button type="button" data-tab="events" title="Map events (V)"><span class="dock-icon">📅</span><span class="dock-label">Events</span></button>
      <span class="dock-sep"></span>
      <button type="button" data-tab="options" title="Options and controls (O)"><span class="dock-icon">⚙️</span><span class="dock-label">Options</span></button>
      <button type="button" id="sound-toggle" title="Sound on/off (M)"><span class="dock-icon">🔊</span><span class="dock-label">Sound</span></button>
      <button type="button" data-tab="news" title="What's new"><span class="dock-icon">📰</span><span class="dock-label">News</span></button>
    </nav>
  </div>

  <div id="menu" class="overlay" hidden>
    <div class="menu-window" role="dialog" aria-label="Menu">
      <div class="menu-tabs">
        <button data-tab="gear">Tackle</button>
        <button data-tab="index">Fish Index</button>
        <button data-tab="armour">Armour</button>
        <button data-tab="pets">Pets</button>
        <button data-tab="achievements">Achievements</button>
        <button data-tab="trophies">Trophies</button>
        <button data-tab="history">History</button>
        <button data-tab="events">Events</button>
        <button data-tab="options">Options</button>
        <button data-tab="news">What's new</button>
        <button id="menu-close" aria-label="Close">✕</button>
      </div>
      <div id="menu-body"></div>
    </div>
  </div>

  <div id="results" class="overlay" hidden>
    <div id="results-body" class="results-window" role="dialog" aria-label="Results"></div>
  </div>

  <div id="join" class="overlay">
    <form id="join-form" novalidate>
      <h1>The Last Cast</h1>
      <p class="tagline">A multiplayer fishing game</p>
      <div class="auth-tabs" role="tablist">
        <button type="button" data-mode="login">Log in</button>
        <button type="button" data-mode="register">Sign up</button>
        <button type="button" data-mode="guest">Guest</button>
      </div>
      <div id="account-fields" class="auth-fields">
        <input id="username" maxlength="16" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false">
        <input id="password" type="password" maxlength="128" placeholder="Password" autocomplete="current-password">
      </div>
      <div id="guest-fields" class="auth-fields" hidden>
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
      </div>
      <p id="auth-hint"></p>
      <button type="submit" id="join-submit">Log in</button>
      <p id="join-error" role="alert"></p>
      <button type="button" class="version-label"></button>
    </form>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
