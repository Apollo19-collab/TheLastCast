<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Last Cast</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="me-panel" class="panel">
      <div id="me-name"></div>
      <div id="account-line">
        <span id="account-label"></span>
        <button type="button" id="account-action"></button>
      </div>
      <div>Score <b id="me-score">0</b> · Catches <b id="me-catches">0</b></div>
      <div>Coins <b id="me-coins">0</b></div>
      <div id="aim-zone"></div>
      <div class="menu-buttons">
        <button data-tab="gear" title="Gear shop (G)">Gear <kbd>G</kbd></button>
        <button data-tab="index" title="Fish index (I)">Fish Index <kbd>I</kbd></button>
        <button data-tab="history" title="Catch history (H)">History <kbd>H</kbd></button>
      </div>
    </div>

    <div id="leaderboard" class="panel">
      <h3>Anglers</h3>
      <ol id="leaderboard-list"></ol>
    </div>

    <div id="feed" class="panel"></div>
    <div id="status"></div>

    <div id="help" class="panel">
      <b>WASD</b> move · <b>Mouse</b> aim · <b>Hold Space/click</b> charge, release to cast ·
      <b>Space/click</b> on a bite to hook · <b>Hold</b> to reel, release when it pulls · <b>Esc</b> reel in · <b>G</b> gear · <b>I</b> fish index · <b>H</b> history
    </div>
  </div>

  <div id="menu" class="overlay" hidden>
    <div class="menu-window" role="dialog" aria-label="Menu">
      <div class="menu-tabs">
        <button data-tab="gear">Gear</button>
        <button data-tab="index">Fish Index</button>
        <button data-tab="history">History</button>
        <button id="menu-close" aria-label="Close">✕</button>
      </div>
      <div id="menu-body"></div>
    </div>
  </div>

  <div id="join" class="overlay">
    <form id="join-form" novalidate>
      <h1>The Last Cast</h1>
      <p class="tagline">A multiplayer fishing game</p>
      <div class="auth-tabs" role="tablist">
        <button type="button" data-mode="login">Log in</button>
        <button type="button" data-mode="register">Sign up</button>
        <button type="button" data-mode="guest">Guest</button>
      </div>
      <div id="account-fields" class="auth-fields">
        <input id="username" maxlength="16" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false">
        <input id="password" type="password" maxlength="128" placeholder="Password" autocomplete="current-password">
      </div>
      <div id="guest-fields" class="auth-fields" hidden>
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
      </div>
      <p id="auth-hint"></p>
      <button type="submit" id="join-submit">Log in</button>
      <p id="join-error" role="alert"></p>
    </form>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
